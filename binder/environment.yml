name: ltc
channels:
  - conda-forge
dependencies:
  - bokeh
  - cartopy
  - cmocean
  - jupyterlab
  - gsw
  - holoviews
  - hvplot
  - mamba
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - panel==0.14.1
